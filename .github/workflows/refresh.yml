name: Refresh jobs
on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 08:00 IST, every day
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/scrape.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Commit updated jobs.json
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || (git commit -m "Daily job refresh" && git push)
